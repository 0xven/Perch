# Dependency updates.
#
# Grouped deliberately. Ungrouped Dependabot on a Next.js app opens a dozen PRs
# a week and they all get ignored, which is worse than not running it - the
# security ones drown in the noise. One PR for patches, one for minors, and
# majors on their own so a Next or React jump gets read properly.

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types: [patch, minor]
    ignore:
      # Majors here are never routine - they need the migration notes read and
      # the app driven in a browser. Left to a deliberate, human-initiated bump.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]

      # BLOCKED UPSTREAM, not by us. The first CI run proved both, so they are
      # ignored to stop a red PR reappearing every week for something we cannot
      # act on. Re-check when eslint-config-next ships support, then DELETE
      # these two entries - they are meant to be temporary.
      #
      #   typescript 7.x  -> "typescript-eslint does not support TS 7.0"
      #                      (eslint-config-next's bundled typescript-eslint)
      #   eslint 10.x     -> eslint-plugin-react calls contextOrFilename
      #                      .getFilename(), removed in ESLint 10's rule API
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]

  # The actions in ci.yml and codeql.yml are pinned by tag; this keeps them
  # current so we are not running a deprecated runner a year from now.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
